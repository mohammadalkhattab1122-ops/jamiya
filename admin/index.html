<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>لوحة الإدارة · جمعية</title>
<meta name="theme-color" content="#F2F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1916" media="(prefers-color-scheme: dark)">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F2;--surface:#FFFFFF;--line:#DCE3DF;--fg:#12201C;--muted:#5A6964;
  --accent:#0F5C4D;--accent-soft:#E0EEE9;--on-accent:#FFFFFF;--gold:#E3A92F;--gold-soft:#FBF1DC;--gold-text:#8A5F0E;
  --paid:#1B7A45;--paid-soft:#E1F2E7;--due:#B4432F;--due-soft:#F8E5E0;--shadow:0 1px 2px rgba(18,32,28,.06),0 4px 16px rgba(18,32,28,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1916;--surface:#12201C;--line:#24352F;--fg:#E8EFEC;--muted:#93A59F;
  --accent:#3FB495;--accent-soft:#163A31;--on-accent:#0E1916;--gold:#E3A92F;--gold-soft:#3A2E14;--gold-text:#E3A92F;
  --paid:#5FCF8C;--paid-soft:#173426;--due:#F08A74;--due-soft:#3D221C;--shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#0E1916;--surface:#12201C;--line:#24352F;--fg:#E8EFEC;--muted:#93A59F;
  --accent:#3FB495;--accent-soft:#163A31;--on-accent:#0E1916;--gold:#E3A92F;--gold-soft:#3A2E14;--gold-text:#E3A92F;
  --paid:#5FCF8C;--paid-soft:#173426;--due:#F08A74;--due-soft:#3D221C;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:15px;line-height:1.55}
h1,h2,h3,.display{font-family:'Readex Pro','IBM Plex Sans Arabic',sans-serif;font-weight:500;margin:0}
h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}.ltr{direction:ltr;unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums}
.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--surface);border-left:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:'Readex Pro';font-weight:700}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;color:var(--fg)}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--due);color:#fff;font-size:12px;display:inline-grid;place-items:center}
aside .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:13px}
main{padding:22px 26px 60px;max-width:1240px;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.kpi .v{font-family:'Readex Pro';font-size:24px;font-weight:500}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .s{font-size:12px;color:var(--muted)}
.two{grid-template-columns:1.4fr 1fr}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{background:var(--due-soft);border-color:transparent;color:var(--due)}
.btn.gold{background:var(--gold-soft);border-color:transparent;color:var(--gold-text)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f input,label.f select,label.f textarea{color:var(--fg);font-size:15px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.paid{background:var(--paid-soft);color:var(--paid)}.pill.due{background:var(--due-soft);color:var(--due)}
.pill.gold{background:var(--gold-soft);color:var(--gold-text)}.pill.accent{background:var(--accent-soft);color:var(--accent)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:12.5px;background:var(--bg);position:sticky;top:0;cursor:pointer;user-select:none;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--bg)}
tbody tr:last-child td{border-bottom:none}
.bars{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.bar .stack{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 0 0;overflow:hidden;background:transparent}
.bar .stack span{display:block}
.bar .lbl{font-size:11px;color:var(--muted);white-space:nowrap}
.bar .val{font-size:11px;font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;vertical-align:-1px}
.req{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.req:first-of-type{border-top:none}
.thumb{width:120px;height:150px;border-radius:10px;background:var(--bg);border:1px solid var(--line);object-fit:cover;cursor:zoom-in;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(520px,100%);background:var(--surface);z-index:21;overflow-y:auto;padding:20px;box-shadow:0 0 40px rgba(0,0,0,.2);transform:translateX(-105%);transition:transform .2s}
.drawer.open{transform:none}.drawer-bg.open{display:block}
.sec{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:40;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:16px}
.lightbox.open{display:flex}.lightbox img{max-width:100%;max-height:85vh;border-radius:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:50;display:none;max-width:90vw}
.login{max-width:380px;margin:12vh auto;display:flex;flex-direction:column;gap:12px}
.feed div{padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.feed div:first-child{border-top:none}
.mob-nav{display:none}
.empty{padding:26px;text-align:center;color:var(--muted)}
.progress{height:6px;background:var(--line);border-radius:4px;overflow:hidden;min-width:70px}
.progress span{display:block;height:100%;background:var(--accent)}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  aside{display:none}
  .mob-nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .mob-nav button{all:unset;cursor:pointer;padding:7px 12px;border-radius:999px;background:var(--bg);white-space:nowrap;font-size:14px}
  .mob-nav button.on{background:var(--accent);color:var(--on-accent)}
  main{padding:16px 16px 60px}
  .two{grid-template-columns:1fr}
  .req{grid-template-columns:90px 1fr}.thumb{width:90px;height:115px}
}
</style>
</head>
<body>
<div id="app"><div class="empty">…جاري التحميل</div></div>
<div class="drawer-bg" id="drawerBg"></div>
<div class="drawer" id="drawer"></div>
<div class="lightbox" id="lightbox"><img id="lbImg" alt="إيصال"><div class="row"><a class="btn sm" id="lbOpen" target="_blank" rel="noopener">فتح بتبويب جديد ↗</a><button class="btn sm" id="lbClose">إغلاق</button></div></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="admin.js"></script>
</body>
</html>
